name: Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests and HTTP check
        run: ./dev check
      - name: Install Playwright and Chromium
        run: |
          npm install --silent --prefix .local/tools playwright@1.49.1
          .local/tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Layout check at 320, 360, 768 and 1280 px
        run: ./dev layout
